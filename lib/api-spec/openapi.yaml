          type: string
          format: uuid
        displayName:
          type: string
        gapCount:
          type: integer
          description: Open gap entries in the student's learning record.
          minimum: 0
        masteryCounts:
          $ref: "#/components/schemas/MasteryCounts"
        lastActiveAt:
          type:
