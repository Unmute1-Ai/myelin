      properties:
        memorization:
          type: integer
          minimum: 0
        recognition:
          type: integer
          minimum: 0
        comprehension:
          type: integer
          minimum: 0
        application:
          type: integer
          minimum: 0
        mastery:
          type: integer
          minimum: 0
      required:
        - memorization
        - recognition
        - comprehension
        - application
        - mastery
    EducatorStudentSummary:
      type: object
